name: Build firmware

# Firmware builder for the Ruijie RG-X60 New, in the spirit of
# P3TERX/Actions-OpenWrt and lgs2007m/Actions-OpenWrt: this repository is the
# build recipe, GitHub Actions is the compiler, the Release is the download page.
#
# Everything needed is here:
#   scripts/zerowrt.py   the pipeline (source clone, feeds, package set, .config,
#                        patches, OTA, toolchain cache)
#   configs/*.config     device configs, one per profile
#   diy-part1.sh         runs before `feeds update` (feeds.conf.default, clones)
#   diy-part2.sh         runs after the package set is in place (source edits)
#   assets/              branding used by the in-tree customisation
#
# Profiles differ only in the package set; every one builds from
# padavanonly/immortalwrt-mt798x-6.6 (mt_wifi 7.6.6.1, GCC 14).

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device profile"
        required: true
        type: choice
        default: ruijie_rg-x60-new-2410-homeproxy
        options:
          - ruijie_rg-x60-new-2410-homeproxy
          - ruijie_rg-x60-new-2410
      lan_ip:
        description: "LAN IP (management address)"
        required: true
        type: string
        default: "10.0.0.1"
      root_password:
        description: "Root password (at least 8 characters)"
        required: true
        type: string
        default: "password"
      wifi_name:
        description: "WiFi name prefix; -2.4G / -5G / -6G is appended"
        required: true
        type: string
        default: "ZeroWrt"
      wifi_password:
        description: "WiFi password: 8-63 safe characters"
        required: true
        type: string
        default: "1234567890"
      cache_toolchain:
        description: "Restore the toolchain cache when available"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BUILD_ROOT: /builder
  ZEROWRT_SOURCE_DIR: /builder/source
  ZEROWRT_DEVICE: ${{ inputs.device }}
  ZEROWRT_DIST: ZeroWrt
  TZ: Asia/Shanghai

jobs:
  build:
    name: Compile firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Show runner and commit
        run: |
          python3 --version
          uname -a
          echo "profile: $ZEROWRT_DEVICE"
          echo "commit:  $(git rev-parse --short HEAD) ($(git rev-parse --abbrev-ref HEAD))"

      - name: Prepare build space
        run: |
          python3 scripts/zerowrt.py system free-disk \
            --build-dir "$BUILD_ROOT" \
            --swap-gb 4 \
            --reserve-gb 6 \
            --min-free-gb 50

      - name: Install build dependencies
        run: python3 scripts/zerowrt.py system install-deps

      - name: Clone build source
        run: |
          python3 scripts/zerowrt.py source clone \
            --dest "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: DIY part 1
        if: ${{ hashFiles('diy-part1.sh') != '' }}
        working-directory: /builder/source
        run: bash "$GITHUB_WORKSPACE/diy-part1.sh"
        env:
          DIY_STAGE: part1
          PIPELINE: ${{ github.workspace }}

      - name: Update feeds
        run: python3 scripts/zerowrt.py source feeds-update --tree "$ZEROWRT_SOURCE_DIR"

      - name: Install feeds
        run: python3 scripts/zerowrt.py source feeds-install --tree "$ZEROWRT_SOURCE_DIR"

      - name: Add external packages
        run: |
          python3 scripts/zerowrt.py packages add \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: DIY part 2
        if: ${{ hashFiles('diy-part2.sh') != '' }}
        working-directory: /builder/source
        run: bash "$GITHUB_WORKSPACE/diy-part2.sh"
        env:
          DIY_STAGE: part2
          PIPELINE: ${{ github.workspace }}

      - name: Apply core customisations
        env:
          ZEROWRT_IP: ${{ inputs.lan_ip }}
          ZEROWRT_ROOT_PASSWORD: ${{ inputs.root_password }}
          ZEROWRT_WIFI_NAME: ${{ inputs.wifi_name }}
          ZEROWRT_WIFI_PASSWORD: ${{ inputs.wifi_password }}
        run: |
          python3 scripts/zerowrt.py source customize \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --assets assets

      - name: Apply patches
        run: |
          python3 scripts/zerowrt.py patches apply \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Apply device .config
        run: |
          python3 scripts/zerowrt.py config apply \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      # The ota subcommands stand down on their own when the profile carries no
      # luci-app-ota, so these three steps are safe for every profile.
      - name: Embed OTA metadata
        run: |
          mkdir -p dist
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OTA_URL="https://${OWNER}.github.io/${REPO_NAME}/ota.json"
          python3 scripts/zerowrt.py ota embed \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --api-url "$OTA_URL" \
            --emit ota-meta.json

      - name: Restore toolchain cache
        if: ${{ inputs.cache_toolchain }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/zerowrt.py cache restore \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --repo "$GITHUB_REPOSITORY"

      - name: Download source archives
        env:
          TMPDIR: /builder/tmp
        run: |
          mkdir -p "$TMPDIR"
          python3 scripts/zerowrt.py build download \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --jobs "$(nproc)"

      - name: Compile firmware
        env:
          TMPDIR: /builder/tmp
        run: |
          python3 scripts/zerowrt.py build compile \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --jobs "$(nproc)"

      - name: Collect artifacts
        run: |
          python3 scripts/zerowrt.py build collect \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --out dist

      - name: Generate OTA index
        run: |
          python3 scripts/zerowrt.py ota index \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --dist dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$ZEROWRT_DEVICE"

      - name: Build summary
        if: success()
        run: |
          {
            echo "## Firmware build"
            echo "profile: \`$ZEROWRT_DEVICE\` @ $(git rev-parse --short HEAD)"
            echo '```'
            cat dist/BUILD_INFO.txt
            echo
            ls -lh dist
            echo '```'
            echo "### SHA256"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ZEROWRT_DEVICE }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # Published with `gh` rather than a release action: the workflow token
      # already creates the `toolchain` release through `gh`, while the
      # third-party action answered 403 "Resource not accessible by
      # integration" on the same token.
      - name: Publish device release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$ZEROWRT_DEVICE"
          repo="$GITHUB_REPOSITORY"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$repo" \
              --title "$tag" --notes-file dist/BUILD_INFO.txt
          else
            gh release create "$tag" --repo "$repo" \
              --title "$tag" --target "$GITHUB_SHA" \
              --notes-file dist/BUILD_INFO.txt
          fi
          mapfile -t files < <(find dist -maxdepth 1 -type f -print | sort)
          gh release upload "$tag" "${files[@]}" --repo "$repo" --clobber
          gh release view "$tag" --repo "$repo" --json url,assets \
            --jq '"release: \(.url)  (\(.assets | length) assets)"' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish OTA page
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/zerowrt.py ota publish \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --dist dist \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$ZEROWRT_DEVICE" \
            --branch gh-pages \
            --site "$ZEROWRT_SOURCE_DIR/package/new/luci-app-ota/site"

      - name: Trim build logs
        if: failure()
        run: |
          mkdir -p dist
          for log in build download defconfig feeds-update feeds-install toolchain; do
            if [ -f "$ZEROWRT_SOURCE_DIR/$log.log" ]; then
              tail -n 3000 "$ZEROWRT_SOURCE_DIR/$log.log" > "dist/$log-tail.log"
            fi
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ZEROWRT_DEVICE }}-logs
          path: dist/*-tail.log
          if-no-files-found: ignore
          retention-days: 7
