name: Build toolchain cache

# Compiles the cross toolchain for one device profile and publishes it as
# `toolchain_<libc>_<arch>_gcc-<major>.tar.zst` in the `toolchain` release of
# this repository. "Build firmware" then restores it and skips the toolchain
# compile, which is roughly a third of a cold build.
#
# Run this once per profile, and again after the target, the libc or the GCC
# version changes. The asset name carries the GCC major, so the 24.10 (GCC 14)
# and 25.12 (GCC 16) caches coexist in the same release.

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device profile"
        required: true
        type: choice
        default: ruijie_rg-x60-new-2410-homeproxy
        options:
          - ruijie_rg-x60-new-2410-homeproxy
          - ruijie_rg-x60-new-2410
          - ruijie_rg-x60-new
      source_ref:
        description: "Override the upstream branch/tag (empty = the profile's branch)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: toolchain-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  BUILD_ROOT: /builder
  ZEROWRT_SOURCE_DIR: /builder/source
  ZEROWRT_DEVICE: ${{ inputs.device }}
  ZEROWRT_DIST: ZeroWrt
  TZ: Asia/Shanghai

jobs:
  toolchain:
    name: Build and publish the toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Show runner and commit
        run: |
          python3 --version
          uname -a
          echo "profile: $ZEROWRT_DEVICE"
          echo "commit:  $(git rev-parse --short HEAD) ($(git rev-parse --abbrev-ref HEAD))"

      - name: Prepare build space
        run: |
          python3 scripts/zerowrt.py system free-disk \
            --build-dir "$BUILD_ROOT" \
            --swap-gb 4 \
            --reserve-gb 6 \
            --min-free-gb 50

      - name: Install build dependencies
        run: python3 scripts/zerowrt.py system install-deps

      - name: Install LLVM
        if: ${{ !contains(inputs.device, '-2410') }}
        run: python3 scripts/zerowrt.py system install-llvm

      - name: Clone build source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          args=(--dest "$ZEROWRT_SOURCE_DIR" --device "$ZEROWRT_DEVICE")
          if [ -n "$SOURCE_REF" ]; then
            args+=(--ref "$SOURCE_REF")
            echo "overriding the source branch: $SOURCE_REF"
          fi
          python3 scripts/zerowrt.py source clone "${args[@]}"

      - name: DIY part 1
        if: ${{ hashFiles('diy-part1.sh') != '' }}
        working-directory: /builder/source
        run: bash "$GITHUB_WORKSPACE/diy-part1.sh"
        env:
          DIY_STAGE: part1
          PIPELINE: ${{ github.workspace }}

      - name: Update feeds
        run: python3 scripts/zerowrt.py source feeds-update --tree "$ZEROWRT_SOURCE_DIR"

      - name: Install feeds
        run: python3 scripts/zerowrt.py source feeds-install --tree "$ZEROWRT_SOURCE_DIR"

      - name: Add external packages
        run: |
          python3 scripts/zerowrt.py packages add \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: DIY part 2
        if: ${{ hashFiles('diy-part2.sh') != '' }}
        working-directory: /builder/source
        run: bash "$GITHUB_WORKSPACE/diy-part2.sh"
        env:
          DIY_STAGE: part2
          PIPELINE: ${{ github.workspace }}

      - name: Apply core customisations
        run: |
          python3 scripts/zerowrt.py source customize \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --assets assets

      - name: Apply patches
        run: |
          python3 scripts/zerowrt.py patches apply \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Apply device .config
        run: |
          python3 scripts/zerowrt.py config apply \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --device "$ZEROWRT_DEVICE"

      - name: Build toolchain
        env:
          TMPDIR: /builder/tmp
        run: |
          mkdir -p "$TMPDIR"
          cd "$ZEROWRT_SOURCE_DIR"
          make -j"$(nproc)" toolchain/compile || make -j1 toolchain/compile V=s

      - name: Publish toolchain cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/zerowrt.py cache save \
            --tree "$ZEROWRT_SOURCE_DIR" \
            --repo "$GITHUB_REPOSITORY"
